name: CI

on:
  pull_request:

jobs:
  ci:
    uses: sapphire-turtle/.github/.github/workflows/rust-ci.yml@v1
    with:
      # bevy needs X11, Wayland and xkbcommon; bevy_winit talks to udev for hot-plug
      # events. The spike's tests construct a bevy App, so the runner needs them.
      linux-packages: >-
        pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
        libxi-dev libxcursor-dev libxrandr-dev
  wasm:
    name: wasm32 build and wasm-bindgen-test (Linux only, spec §12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup component add rust-src
      - run: cargo install cargo-nextest wasm-bindgen-cli --locked
      - uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - run: echo "CHROMEDRIVER=$(which chromedriver)" >> "$GITHUB_ENV"
      - run: echo "WASM_BINDGEN_TEST_TIMEOUT=120" >> "$GITHUB_ENV"
      - run: echo "HEADLESS=1" >> "$GITHUB_ENV"
      - run: cargo check --workspace --target wasm32-unknown-unknown
      # Common/table are checked as wasm libraries; their tests run on the host.
      # web's own roundtrip (§12): in a browser, on the origin the runner bound — Task 12's headless
      # binary, no eframe, no window.
      - run: >-
          cargo test -p padparadscha-classics-web --target wasm32-unknown-unknown
          --target-dir target/wasm32-unknown-unknown --tests
