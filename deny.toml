# cargo-deny config. Run locally with `cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# The shared starting point for sapphire-turtle repositories
# (sapphire-framework/ci/templates/deny.toml). Keep repository-specific entries
# under `ignore` and `exceptions`, each with its reason.

[graph]
# The platforms release binaries are published for. Drops UEFI/WASM-only
# transitive dependencies such as `r-efi`, so their licenses need no allowing.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "warn"
# Every ignore needs a `reason`, so the next contributor can tell whether it is
# still load-bearing. Re-check them when the dependency they name moves.
ignore = [
    # Unmaintained (author-declared), no vulnerability, no safe upgrade: the gui stack reads font
    # files with ttf-parser directly and through fontdb; the suggested alternative (skrifa)
    # is a different font stack.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained (author-declared); the gui stack reads font files with it directly and through fontdb. The suggested alternative (skrifa) is a different font stack." },
    # Unmaintained (author-declared), no vulnerability, all versions affected -- no safe upgrade to take.
    # chrono arrives through rmcp (the ACP transport) and axum-test (the tests' server), not from an
    # entry of ours; a consumer cannot move it.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (author-declared) and every version is affected; it arrives through rmcp and axum-test, two crates this app does not own. Nothing to upgrade to." },
]

[licenses]
# Permissive SPDX identifiers. Re-survey with `cargo deny list --layout license`
# before widening; prefer a per-crate entry under `exceptions` to adding here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # An application's own desktop app is GPL-3.0-or-later with an app store
    # exception (ci/README.md). Scoped to that crate, so a GPL dependency
    # cannot slip in unnoticed:
    # { name = "<app>-desktop", allow = ["GPL-3.0-or-later"] },
    # egui's fallback UI font is under the OFL and the Ubuntu Font Licence: they
    # govern the typefaces it embeds, not code, so they are scoped to this crate
    # rather than allowed for every dependency.
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# Duplicate versions are too common in real workspaces to be worth a warning.
multiple-versions = "allow"
wildcards = "deny"
# A `path` dependency without a version (a workspace crate's dev-dependency, or a
# crate that is not published) is not a wildcard on the registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # The framework fork, on its wasm branch, until the v0.11.0-line platform dialogs
    # and open_in_file_manager wasm gate leaks are fixed upstream and released.
    "https://github.com/sapphire-turtle/corundum-framework",
    # The fork, on its egui-0.37 branch, until upstream releases egui 0.37 support (spec 2.2).
    "https://github.com/sapphire-turtle/bevy_egui",
]
