[package]
name = "padparadscha-classics-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Bevy 0.20's DefaultPlugins include WinitPlugin only with bevy_winit and a platform.
bevy = { workspace = true, features = ["bevy_winit", "x11", "wayland", "default_font", "bevy_log", "bevy_state"] }
bevy_egui.workspace = true
padparadscha-classics-core.workspace = true
padparadscha-common.workspace = true
padparadscha-table.workspace = true
corundum-framework.workspace = true
getrandom.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
