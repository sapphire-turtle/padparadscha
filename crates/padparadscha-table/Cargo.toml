[package]
name = "padparadscha-table"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Every entry reads only `.workspace = true` (§2.3); the pins live in the root table below.
bevy.workspace = true
padparadscha-common.workspace = true      # the engine CONSUMES common's types (Task 5's), never re-declares them
corundum-framework.workspace = true      # locale + i18n: §5.3's conversion layer renders rows through them
rapier3d.workspace = true         # rigid bodies on the table, in f64 — the physics types are rapier3d's own Vector3<f64> (§5.2)
fixed.workspace = true            # the read-out's fixed point alone (§7.1); nothing here touches the simulation side
rand_core.workspace = true        # the command stream's u64 draws; the named generator stays common's (§7.1)
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web backend and WebGL2, as features added to the same root entry — never a second version.
bevy = { workspace = true, features = ["web", "webgl2"] }

[dev-dependencies]
serde_json.workspace = true
# This crate's own spike test runs in a browser too, in the `wasm` job (spec §12).
wasm-bindgen-test.workspace = true

[features]
default = ["render"]
render = ["bevy/bevy_render", "bevy/bevy_core_pipeline", "bevy/bevy_picking"]
